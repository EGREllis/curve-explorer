services:
  database:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DATABASE: postgres
      POSTGRES_USER: postgres
    volumes:
      - ./database/:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  springboot:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    links:
      - database
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
